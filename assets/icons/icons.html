<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BrainChain — Icon Preview</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    background: var(--bc-bg-primary);
    color: var(--bc-text-primary);
    font-family: var(--bc-font-sans);
    padding: 32px;
  }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
  p.lead { color: var(--bc-text-secondary); margin: 0 0 32px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .card {
    background: var(--bc-bg-secondary);
    border: 1px solid var(--bc-border-soft);
    border-radius: 8px;
    padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: border-color 150ms;
    cursor: pointer;
  }
  .card:hover { border-color: var(--bc-border); }
  .card img { width: 24px; height: 24px; color: var(--bc-text-primary); filter: invert(1); }
  .card span {
    font-family: var(--bc-font-mono);
    font-size: 11px;
    color: var(--bc-text-tertiary);
  }
  .toolbar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; }
  .toolbar input { background: var(--bc-bg-tertiary); border: 1px solid var(--bc-border); border-radius: 8px; padding: 8px 12px; color: inherit; font: inherit; font-size: 13px; width: 240px; }
  .toolbar input:focus { outline: none; border-color: var(--bc-accent); box-shadow: var(--bc-shadow-focus-ring); }
  .toolbar .count { color: var(--bc-text-tertiary); font-size: 12px; }
</style>
</head>
<body>
<h1>BrainChain — Iconografia</h1>
<p class="lead">53 ícones · Lucide v0.469.0 · 24×24 · stroke="currentColor" · stroke-width="2"</p>

<div class="toolbar">
  <input id="q" placeholder="Buscar ícone..." />
  <span class="count" id="cnt"></span>
</div>

<div class="grid" id="grid"></div>

<script>
fetch('icons/manifest.json').then(r => r.json()).then(m => {
  const grid = document.getElementById('grid');
  const cnt = document.getElementById('cnt');
  const q = document.getElementById('q');
  const render = (filter = '') => {
    grid.innerHTML = '';
    const items = m.icons.filter(n => n.includes(filter.toLowerCase()));
    items.forEach(n => {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = `<img src="icons/${n}.svg" alt=""><span>${n}</span>`;
      c.onclick = () => navigator.clipboard.writeText(n);
      grid.appendChild(c);
    });
    cnt.textContent = `${items.length} de ${m.icons.length} · clique para copiar nome`;
  };
  render();
  q.addEventListener('input', e => render(e.target.value));
});
</script>
</body>
</html>
